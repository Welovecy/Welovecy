name: Fetch partner photos
on:
  push:
    branches: [partner-images]
    paths: [scripts/content/partner_images.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/content/partner_images.py
      - name: Commit the photos
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git add public/img/partners
          git commit -m "Partner photos [skip ci]"
          git push origin partner-images

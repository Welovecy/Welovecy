name: Refresh map pins from OpenStreetMap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium==4.0.2
      - run: python3 scripts/geo/osm_refresh.py
      - name: Commit results
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git add data/work/osm_pins.json data/work/osm_hotel_gaps.json data/work/nominatim_cache.json
          git diff --cached --quiet || git commit -m "Refresh map pins from OpenStreetMap [skip ci]"
          git push

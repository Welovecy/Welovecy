name: Bus feeds probe
on:
  push:
    branches: [bus-feeds]
    paths: [scripts/bus/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/bus/probe.py
      - name: Push results
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          ls -la bus_probe
          git add -f bus_probe
          git commit -qm "Bus feeds probe [skip ci]"
          git push origin bus-feeds

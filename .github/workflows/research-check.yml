name: Research source check
on:
  push:
    branches: [research-check]
    paths: [scripts/research/urls.txt, scripts/research/fetch_sources.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 scripts/research/fetch_sources.py
      - name: Push results
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git add -f research_check
          git commit -qm "Research source check [skip ci]"
          git push origin research-check

name: Extract coastline for map graphics
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "minlon minlat maxlon maxlat"
        default: "33.90 34.93 34.11 35.03"
permissions:
  contents: write
jobs:
  coast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium==4.0.2
      - run: python3 scripts/geo/coast_extract.py ${{ github.event.inputs.bbox }} coast.json
      - name: Push to the coastline branch
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git checkout -B coastline
          git add -f coast.json
          git commit -m "Coastline extract [skip ci]"
          git push -f origin coastline

name: Design screenshots
on:
  push:
    branches: ["design-*"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npm run build
      - run: (npx next start -p 3000 &) && sleep 8 && node scripts/check/shots.js http://localhost:3000 shots
      - name: Push screenshots to the shots branch
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git fetch origin shots || true
          git checkout --orphan shots-new
          git rm -rq --cached . && git clean -fdq -e shots
          git add -f shots
          git commit -qm "Screenshots for ${GITHUB_REF_NAME} [skip ci]"
          git push -f origin shots-new:shots

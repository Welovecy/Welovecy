name: Island outline
on:
  push:
    branches: [island]
    paths: [scripts/geo/island_outline.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium==4.0.2
      - run: python3 scripts/geo/island_outline.py island.json
      - name: Push the outline
        run: |
          git config user.name "We Love Cyprus data bot"
          git config user.email "welovecy@users.noreply.github.com"
          git add -f island.json
          git commit -m "Island outline [skip ci]"
          git push origin island
